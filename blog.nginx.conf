server {
    listen 80;
    server_name 8.148.194.119;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name 8.148.194.119;

    # SSL
    ssl_certificate /data/nginx/ssl/2025-10-24/fullchain.crt;
    ssl_certificate_key /data/nginx/ssl/2025-10-24/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 静态资源
    location /_next/static/ {
        alias /data/blog-app/.next/static/;
        expires 1y;
        access_log off;
    }

    location /public/ {
        alias /data/blog-app/public/;
        expires 30d;
        access_log off;
    }

    # 后端 API
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Next.js SSR
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    access_log /var/log/nginx/next-access.log;
    error_log /var/log/nginx/next-error.log;
}
